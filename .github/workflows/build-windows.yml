name: Build Windows

on:
  push:
    branches: [ main, dev, Driver ]
  pull_request:
    branches: [ main, dev, Driver ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Verify build failure propagation
      run: .\Windows\tests\compile-entrypoint-test.ps1 -OutputDirectory "$env:RUNNER_TEMP\proxybridge-build-tests"
      shell: pwsh

    - name: Verify separate application and driver packaging inputs
      run: .\Windows\installer\tests\package-inputs-test.ps1 -Results "$env:RUNNER_TEMP\proxybridge-package-tests"
      shell: pwsh

    - name: Build unsigned user-mode components (driver requires WDK)
      run: |
        cd Windows
        .\compile.ps1 -NoSign -UserModeOnly -PlatformToolset v143 -WindowsSdkVersion 10.0.26100.0
      shell: pwsh

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ProxyBridge-Unsigned-UserMode-${{ github.sha }}
        if-no-files-found: error
        path: |
          Windows/output/*.exe
          Windows/output/*.dll
          Windows/output/build-result.json
        retention-days: 30

    - name: List output files
      run: |
        Write-Host "`nBuild artifacts:"
        Get-ChildItem Windows/output -File | ForEach-Object {
          $size = [math]::Round($_.Length/1MB, 2)
          Write-Host "  $($_.Name) - $size MB"
        }
      shell: pwsh
