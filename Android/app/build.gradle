plugins {
    id 'com.android.application'
}

android {
    namespace 'com.interceptsuite.proxybridge'
    compileSdk 37

    defaultConfig {
        applicationId 'com.interceptsuite.ProxyBridge'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // hev-socks5-tunnel, fetched by ../fetch-hev.sh, is compiled with its own makefile
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    // the Android jar only has stubs of org.json, tests on the JVM need the real thing
    testImplementation 'org.json:json:20250517'
}
