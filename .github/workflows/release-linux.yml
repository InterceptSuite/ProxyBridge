name: Release ProxyBridge Linux

on:
  # manual only, so creating a release no longer triggers every OS build. create
  # the release, then run just the workflow for the OS you want against its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the installer to (e.g. v4.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    if: github.actor == 'Anof-cyber'

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ inputs.tag }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          make \
          bzip2 \
          clang \
          linux-tools-common \
          linux-tools-generic \
          libbpf-dev \
          libgtk-3-dev \
          pkg-config
      shell: bash

    - name: Locate bpftool
      # On Ubuntu "bpftool" is only a virtual package; the real binary ships in linux-tools-* and is not on PATH
      # for the runner's cloud kernel, so find it explicitly.
      run: |
        shopt -s nullglob
        candidates=(/usr/lib/linux-tools/*/bpftool)
        [ ${#candidates[@]} -gt 0 ] || { echo "bpftool binary not found"; ls /usr/lib/linux-tools 2>&1 || true; exit 1; }
        echo "BPFTOOL=${candidates[0]}" >> "$GITHUB_ENV"
        "${candidates[0]}" version | head -1
      shell: bash

    - name: Build project
      run: |
        cd Linux
        chmod +x build.sh
        ./build.sh
      shell: bash

    - name: Copy setup script to output
      run: |
        echo "Copying setup.sh to output directory..."
        cp Linux/setup.sh Linux/output/
        chmod +x Linux/output/setup.sh
        echo "✓ Setup script copied"
      shell: bash

    - name: Verify build output
      run: |
        echo "=== Build Output ==="
        ls -lh Linux/output/
        echo ""
        if [ -f "Linux/output/libproxybridge.so" ]; then
          echo "✓ Library built successfully"
          file Linux/output/libproxybridge.so
        else
          echo "✗ Library build failed"
          exit 1
        fi
        echo ""
        if [ -f "Linux/output/ProxyBridge" ]; then
          echo "✓ CLI built successfully"
          file Linux/output/ProxyBridge
        else
          echo "✗ CLI build failed"
          exit 1
        fi
        echo ""
        if [ -f "Linux/output/setup.sh" ]; then
          echo "✓ Setup script copied"
        else
          echo "✗ Setup script missing"
          exit 1
        fi
      shell: bash

    - name: Extract version from tag
      id: version
      run: |
        VERSION="$TAG"
        # Remove 'v' prefix if present
        VERSION="${VERSION#v}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
      shell: bash
      env:
        TAG: ${{ inputs.tag }}

    - name: Create release archive
      run: |
        ARCHIVE_NAME="ProxyBridge-Linux-v${VERSION}.tar.gz"

        echo "Creating archive: $ARCHIVE_NAME"
        cd Linux/output
        tar -czf "../$ARCHIVE_NAME" ./*

        echo ""
        echo "Archive created successfully:"
        ls -lh "../$ARCHIVE_NAME"

        # Move archive to root for upload
        mv "../$ARCHIVE_NAME" "../../$ARCHIVE_NAME"
        cd ../..
        sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
        cat "$ARCHIVE_NAME.sha256"
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: List release files
      run: |
        echo ""
        echo "==================================="
        echo "Release Files:"
        echo "==================================="
        ls -lh ProxyBridge-Linux-*.tar.gz

        echo ""
        echo "Archive contents:"
        tar -tzf ProxyBridge-Linux-*.tar.gz
      shell: bash

    - name: Upload archive to release
      run: |
        gh release upload "$TAG" ProxyBridge-Linux-v*.tar.gz ProxyBridge-Linux-v*.tar.gz.sha256 --clobber
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ProxyBridge-Linux-Release-${{ steps.version.outputs.version }}
        path: |
          ProxyBridge-Linux-*.tar.gz
          ProxyBridge-Linux-*.tar.gz.sha256
        retention-days: 90
