sonar.projectKey=InterceptSuite_ProxyBridge_Linux
sonar.organization=interceptsuite
sonar.projectName=ProxyBridge (Linux)
sonar.sourceEncoding=UTF-8

# Everything under Linux/ is analysed; the unit-test and benchmark programs in the tests folders are test code.
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/tests/**, **/out/**, **/build/**, **/obj/**, **/third_party/**
sonar.test.inclusions=**/tests/**

# C is analysed from the gcc/clang compiler calls recorded by the Build Wrapper (.github/workflows/sonarqube.yml).
