name: Label issue by platform

# A GitHub issue form can only attach fixed labels (bug -> `bug`, feature -> `enhancement`). It cannot react to the
# answer of a dropdown. This workflow reads the "Platform" answer of the bug report and feature request forms and adds
# the matching platform label: Windows -> `Windows`, macOS -> `MacOS`, Linux -> `Linux`, All platforms -> all three.
#
# It only ever ADDS labels. If a maintainer has already put a platform label on the issue, later edits of the issue
# do not change anything. It does not check out or run any code from the issue; it only reads the issue text.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

concurrency:
  group: label-platform-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Add platform label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add platform label
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            // the label names that exist in this repository
            const PLATFORM_LABELS = { 'windows': ['Windows'], 'macos': ['MacOS'], 'linux': ['Linux'],
                                      'all platforms': ['Windows', 'MacOS', 'Linux'] };
            const ALL = ['Windows', 'MacOS', 'Linux'];

            // issue forms render each answer as "### <label>" followed by the answer on its own line
            const m = /^###\s+Platform\s*\r?\n+\s*([^\r\n]+)/im.exec(issue.body || '');
            if (!m) { core.info('No Platform answer in the issue body: nothing to label'); return; }
            const wanted = PLATFORM_LABELS[m[1].trim().toLowerCase()];
            if (!wanted) { core.info(`Unknown platform "${m[1].trim()}": nothing to label`); return; }

            // edits: respect labels that are already there (a maintainer may have set them on purpose)
            const current = (issue.labels || []).map((l) => l.name);
            if (context.payload.action === 'edited' && current.some((n) => ALL.includes(n))) {
              core.info('A platform label is already set: leaving it alone');
              return;
            }

            const toAdd = wanted.filter((n) => !current.includes(n));
            if (!toAdd.length) { core.info('Labels already present'); return; }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: toAdd });
            core.info(`Added: ${toAdd.join(', ')}`);
